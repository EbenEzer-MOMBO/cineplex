name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile (Expo / React Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (jest-expo)
        run: npm test -- --ci

      # Non-blocking for now: pre-existing lint debt in unrelated screens.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Report (non-blocking) known npm advisories; triage then make blocking.
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high
        continue-on-error: true
